# Render Blueprint for the sync API. In Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: beautybayafrica-pos
    runtime: node
    # Same area as the Neon database (aws-eu-central-1), so queries stay fast.
    region: frankfurt
    plan: free
    branch: main
    # Installs and builds only the API and the shared types it uses.
    buildCommand: >-
      corepack pnpm install --frozen-lockfile --filter sync-api... &&
      corepack pnpm --filter sync-api... run build
    # Applies any new database migrations, then starts the server.
    startCommand: cd apps/sync-api && node dist/migrate.js && node dist/index.js
    healthCheckPath: /health
    # Only redeploy when the API or its shared code changes.
    buildFilter:
      paths:
        - apps/sync-api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Render sits in front of the server as a proxy.
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      # Asked for when the Blueprint is created. Copy the two database values
      # from the repo root's .env.local (written by `neon deploy`).
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Same secret as the WooCommerce "product updated" webhook, which points
      # at https://<this service>/webhooks/woocommerce.
      - key: WOOCOMMERCE_WEBHOOK_SECRET
        sync: false

  # The website: the till and back-office screens, built as static files.
  - type: web
    name: beautybayafrica-pos-app
    runtime: static
    branch: main
    buildCommand: >-
      corepack pnpm install --frozen-lockfile --filter staff-terminal... &&
      corepack pnpm --filter staff-terminal... run build
    staticPublishPath: apps/staff-terminal/out
    buildFilter:
      paths:
        - apps/staff-terminal/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    # Each page is exported as <page>.html; serve it at its plain address.
    routes:
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /pos
        destination: /pos.html
      - type: rewrite
        source: /inventory
        destination: /inventory.html
      - type: rewrite
        source: /sales
        destination: /sales.html
      - type: rewrite
        source: /customers
        destination: /customers.html
      - type: rewrite
        source: /suppliers
        destination: /suppliers.html
      - type: rewrite
        source: /expenses
        destination: /expenses.html
      - type: rewrite
        source: /requests
        destination: /requests.html
      - type: rewrite
        source: /request
        destination: /request.html
      - type: rewrite
        source: /staff
        destination: /staff.html
      - type: rewrite
        source: /forgot-pin
        destination: /forgot-pin.html
      - type: rewrite
        source: /activity
        destination: /activity.html
      - type: rewrite
        source: /users
        destination: /users.html
      - type: rewrite
        source: /store-items
        destination: /store-items.html
      - type: rewrite
        source: /user
        destination: /user.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      # The server the website talks to; baked in when the site is built.
      - key: NEXT_PUBLIC_API_URL
        value: https://beautybayafrica-pos.onrender.com
